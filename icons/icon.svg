<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="60" fill="url(#grad1)"/>

  <!-- Highlighter pen -->
  <g transform="translate(35, 35)">
    <!-- Pen body -->
    <rect x="10" y="15" width="40" height="50" rx="3" fill="#FFD700" stroke="#FFA500" stroke-width="2"/>

    <!-- Pen tip -->
    <polygon points="15,65 45,65 40,75 20,75" fill="#FFA500"/>

    <!-- Highlight mark -->
    <rect x="5" y="25" width="50" height="8" rx="2" fill="#FFEB3B" opacity="0.7"/>
    <rect x="8" y="38" width="45" height="8" rx="2" fill="#8BC34A" opacity="0.7"/>
  </g>

  <!-- Sparkle effect -->
  <circle cx="90" cy="30" r="3" fill="white" opacity="0.9"/>
  <circle cx="95" cy="40" r="2" fill="white" opacity="0.8"/>
  <circle cx="30" cy="95" r="2.5" fill="white" opacity="0.85"/>
</svg>
